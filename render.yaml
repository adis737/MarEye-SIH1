services:
  - type: web
    name: mareye-sih1
    env: node
    plan: free
    buildCommand: |
      # Set npm cache directory for persistence
      export NPM_CONFIG_CACHE=/opt/render/project/.npm
      
      # Install dependencies
      echo "Installing Node.js dependencies..."
      npm ci --frozen-lockfile --prefer-offline
      
      # Build the application with proper environment
      echo "Building Next.js application..."
      NODE_ENV=production npm run build:direct
      
      # Verify build output
      echo "Build completed. Checking .next directory..."
      ls -la .next/
    startCommand: |
      echo "Starting Next.js application..."
      NODE_ENV=production npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_CACHE
        value: /opt/render/project/.npm
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
      - key: SKIP_PYTHON_DEPS
        value: true
    # Health check
    healthCheckPath: /
    # Auto-deploy from enchance branch
    autoDeploy: true
    branch: enchance
    # Build settings for better caching
    buildFilter:
      paths:
        - "node_modules/**"
        - ".next/**"
        - ".npm/**"
        - "package-lock.json"
        - "package.json"
